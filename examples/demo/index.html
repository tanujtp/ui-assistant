<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Projects · UI Assistant demo</title>
    <style>
      :root { --bg: #f6f7fb; --card: #fff; --fg: #16181d; --muted: #6b7280; --line: #e6e8ef; --brand: #6d5efc; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); display: flex; min-height: 100vh; }
      nav { width: 220px; background: #14151a; color: #cfd2dc; padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; }
      nav .logo { color: #fff; font-weight: 700; font-size: 18px; padding: 0 10px 18px; }
      nav a { color: inherit; text-decoration: none; padding: 9px 10px; border-radius: 8px; font-size: 14px; }
      nav a.active, nav a:hover { background: #23252d; color: #fff; }
      main { flex: 1; padding: 28px 36px; max-width: 1000px; }
      .top { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
      .top h1 { margin: 0; font-size: 24px; flex: 1; }
      input, select { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 14px; background: #fff; }
      .btn { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font: inherit; font-size: 14px; cursor: pointer; }
      .btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600; }
      .grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
      .card h2 { margin: 0 0 12px; font-size: 15px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
      .pill { background: #e8f8ee; color: #15803d; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
      form.invite { display: grid; gap: 10px; }
      label { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
    </style>
  </head>
  <body>
    <nav aria-label="Main">
      <div class="logo">▲ Acme</div>
      <a class="active" href="#projects">Projects</a>
      <a href="#team">Team</a>
      <a id="nav-billing" href="#billing">Billing</a>
      <a href="#settings">Settings</a>
    </nav>
    <main>
      <div class="top">
        <h1>Projects</h1>
        <input id="search" type="search" placeholder="Search projects" aria-label="Search projects" />
        <button id="export-btn" class="btn" type="button">Export report</button>
        <button id="new-project" class="btn primary" type="button">New project</button>
      </div>
      <div class="grid">
        <section class="card" aria-labelledby="recent">
          <h2 id="recent">Recent projects</h2>
          <table>
            <thead><tr><th>Name</th><th>Owner</th><th>Status</th></tr></thead>
            <tbody>
              <tr><td>Website redesign</td><td>Priya</td><td><span class="pill">Active</span></td></tr>
              <tr><td>Mobile onboarding</td><td>Marco</td><td><span class="pill">Active</span></td></tr>
              <tr><td>Q4 analytics</td><td>Jun</td><td><span class="pill">Active</span></td></tr>
            </tbody>
          </table>
        </section>
        <section class="card" aria-labelledby="team">
          <h2 id="team">Invite a teammate</h2>
          <form class="invite" onsubmit="return false">
            <label>Email<input id="invite-email" type="email" placeholder="name@company.com" /></label>
            <label>Role
              <select id="invite-role"><option>Member</option><option>Admin</option><option>Viewer</option></select>
            </label>
            <button id="send-invite" class="btn primary" type="submit">Send invite</button>
          </form>
        </section>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
