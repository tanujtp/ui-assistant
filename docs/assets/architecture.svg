<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d5efc"/></marker>
    <style>
      .box { fill: #fff; stroke: #d9d6ff; stroke-width: 2; }
      .core { fill: #f1efff; stroke: #6d5efc; stroke-width: 2; }
      .t { font-size: 17px; font-weight: 700; fill: #14151a; }
      .s { font-size: 13px; fill: #555b6b; }
      .l { stroke: #6d5efc; stroke-width: 2; fill: none; }
      .lab { font-size: 12px; fill: #6d5efc; font-weight: 600; }
    </style>
  </defs>
  <rect width="1100" height="420" fill="#fafaff" rx="16"/>

  <rect class="box" x="30" y="150" width="200" height="120" rx="14"/>
  <text class="t" x="130" y="190" text-anchor="middle">Host page (DOM)</text>
  <text class="s" x="130" y="215" text-anchor="middle">buttons, inputs, links</text>
  <text class="s" x="130" y="235" text-anchor="middle">+ product knowledge</text>

  <rect class="core" x="300" y="40" width="500" height="340" rx="18"/>
  <text class="t" x="550" y="72" text-anchor="middle">ui-assistant core</text>

  <rect class="box" x="325" y="100" width="210" height="80" rx="12"/>
  <text class="t" x="430" y="132" text-anchor="middle">snapshot</text>
  <text class="s" x="430" y="156" text-anchor="middle">privacy-safe page map</text>

  <rect class="box" x="565" y="100" width="210" height="80" rx="12"/>
  <text class="t" x="670" y="132" text-anchor="middle">prompt</text>
  <text class="s" x="670" y="156" text-anchor="middle">untrusted-data framing</text>

  <rect class="box" x="565" y="215" width="210" height="80" rx="12"/>
  <text class="t" x="670" y="247" text-anchor="middle">parse + validate</text>
  <text class="s" x="670" y="271" text-anchor="middle">JSON, capped, never throws</text>

  <rect class="box" x="325" y="215" width="210" height="80" rx="12"/>
  <text class="t" x="430" y="247" text-anchor="middle">resolve targets</text>
  <text class="s" x="430" y="271" text-anchor="middle">id / selector to live element</text>

  <rect class="box" x="325" y="310" width="450" height="52" rx="12"/>
  <text class="t" x="550" y="341" text-anchor="middle">widget: chat, tour card, highlighter (Shadow DOM)</text>

  <rect class="box" x="870" y="105" width="200" height="190" rx="14"/>
  <text class="t" x="970" y="140" text-anchor="middle">LLMProvider</text>
  <text class="s" x="970" y="172" text-anchor="middle">Anthropic</text>
  <text class="s" x="970" y="194" text-anchor="middle">OpenAI-compatible / Ollama</text>
  <text class="s" x="970" y="216" text-anchor="middle">Your proxy (recommended)</text>
  <text class="s" x="970" y="238" text-anchor="middle">Scripted (offline)</text>
  <text class="s" x="970" y="270" text-anchor="middle">or implement your own</text>

  <path class="l" d="M230 210 H300" marker-end="url(#a)"/>
  <path class="l" d="M535 140 H565" marker-end="url(#a)"/>
  <path class="l" d="M775 140 H822 V170 H870" marker-end="url(#a)"/>
  <path class="l" d="M870 230 H822 V255 H775" marker-end="url(#a)"/>
  <path class="l" d="M565 255 H535" marker-end="url(#a)"/>
  <path class="l" d="M430 295 V310" marker-end="url(#a)"/>
  <text class="lab" x="265" y="200" text-anchor="middle">read</text>
  <text class="lab" x="846" y="162" text-anchor="middle">ask</text>
  <text class="lab" x="846" y="274" text-anchor="middle">reply</text>
</svg>
